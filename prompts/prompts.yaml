# LiteHarness Prompt Manifest — Source of Truth Index
#
# Each entry maps a prompt ID to its .md file.
# Extensions and services read from .liteharness/prompts/<file>,
# falling back to resources/litesuite/prompts/<file> if not found.
#
# === Cognitive Architecture System ===
# Per-polymath cognitive architectures live in:
#   resources/litesuite/prompts/cognitive-architectures/{leader,worker,thinker,reviewer}/{name}.md
# These are GENERATED by scripts/generate_cognitive_architectures.py and combine
# the tier preamble (operational role) with the polymath's cognitive architecture.
#
# Pi-extensions load the standalone tier preambles below as role-glue, then
# stack per-polymath content from resources/litesuite/agents/polymathic-*.md
# at runtime based on env-var assignment.

prompts:
  # === Role Prompts (Tier Preambles) ===
  - id: orchestrator-role
    tier: T1
    group: role
    file: orchestrator-role.md
    description: "Orchestrator agent role — coordination, tools, protocol, Ryan's cognitive architecture"

  - id: leader-preamble
    tier: T2
    group: preamble
    file: preambles/leader-preamble.md
    description: "Leader tier preamble — task decomposition, worker management, kanban (GENERATED)"

  - id: worker-preamble
    tier: T3
    group: preamble
    file: preambles/worker-preamble.md
    description: "Worker tier preamble — tasks claim/complete protocol (GENERATED)"

  - id: thinker-preamble
    tier: T4
    group: preamble
    file: preambles/thinker-preamble.md
    description: "Thinker tier preamble — read-only constraint + roundtable synthesis (GENERATED)"

  - id: reviewer-preamble
    tier: T5
    group: preamble
    file: preambles/reviewer-preamble.md
    description: "Reviewer tier preamble — read-only constraint + verdict format (GENERATED)"

  - id: librarian-role
    tier: T5
    group: role
    file: librarian-role.md
    description: "Librarian agent role — architecture doc verification and drift repair"

  - id: bootstrap-harness
    tier: ALL
    group: role
    file: bootstrap-harness.md
    description: "Harness methodology section for CLAUDE.md / AGENTS.md"

  # === Operational Templates ===
  - id: thinker-synthesis
    tier: T4
    group: template
    file: thinker-synthesis.md
    description: "Synthesis instructions for polymathic roundtable convergence"

  - id: thinker-debate
    tier: T4
    group: template
    file: thinker-debate.md
    description: "Per-round debate prompt template with round/context placeholders"

  - id: reviewer-template
    tier: T5
    group: template
    file: reviewer-template.md
    description: "Code review prompt — diff injection + verdict format"

  - id: hitl-clause
    tier: T1
    group: template
    file: hitl-clause.md
    description: "Human-in-the-loop clause for irreversible actions"

  - id: agent-pool-guide
    tier: T1/T2
    group: template
    file: agent-pool-guide.md
    description: "Polymathic agent pool table + conventional commit type mapping"

  # === Deprecated files deleted 2026-04-20 ===
  # leader-role.md, worker-role.md, thinker-constraints.md, reviewer-role.md
  # providers/claude-code.md, claude/*.md — all merged into generator preambles
